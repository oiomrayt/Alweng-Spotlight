name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac and keyboard
      placeholder: "MacBook Pro M3, built-in keyboard"
    validations:
      required: true
  - type: input
    id: input_sources
    attributes:
      label: Input sources
      placeholder: "RussianWin and U.S."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
