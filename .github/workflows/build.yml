name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build universal application and release files
        run: ./scripts/package-release.sh

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict "dist/Spotlight English.app"
          plutil -lint "dist/Spotlight English.app/Contents/Info.plist"
          lipo -info "dist/Spotlight English.app/Contents/MacOS/SpotlightEnglish"
          lipo "dist/Spotlight English.app/Contents/MacOS/SpotlightEnglish" -verify_arch arm64 x86_64
          (cd dist/release && shasum -a 256 -c SHA256SUMS.txt)

      - name: Check release tag matches app version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "$RELEASE_TAG" = "v$APP_VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotlight-English
          path: dist/release/*

      - name: Attach files to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/release/* --clobber
